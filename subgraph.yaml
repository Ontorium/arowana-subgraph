          abis:
              - name: PancakeV3Pool
                file: ./abis/PancakeV3Pool.json
          eventHandlers:
              - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24,uint128,uint128)
                handler: handleSwapV3
          file: ./src/swap-v3.ts

    - kind: ethereum
      name: PancakeV3Pool_AGT_USDT
      network: arbitrum-sepolia
      source:
          address: "0x6486Be521993fBddE2875E168B87F5D4C1B67c92"
          abi: PancakeV3Pool
          startBlock: 237189393
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.7
          language: wasm/assemblyscript
          entities:
              - Swap
              - SwapStats
