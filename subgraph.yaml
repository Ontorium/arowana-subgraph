              - DailyStats
          abis:
              - name: PancakeV2Pair
                file: ./abis/PancakeV2Pair.json
          eventHandlers:
              - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
                handler: handleSwapV2
          file: ./src/swap-v2.ts

    # ===== PancakeSwap V3 Pools =====

    - kind: ethereum
      name: PancakeV3Pool_AGT_USDC
      network: arbitrum-sepolia
      source:
          address: "0x2a835aC4C5dD862c19f18aB8F5496F4004CDE0F9"
          abi: PancakeV3Pool
          startBlock: 237189904
      mapping:
          kind: ethereum/events
