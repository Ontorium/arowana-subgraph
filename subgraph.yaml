specVersion: 1.0.0
indexerHints:
    prune: auto
schema:
    file: ./schema.graphql
dataSources:
    # ===== AGT Token =====
    - kind: ethereum
      name: GoldToken
      network: arbitrum-sepolia
      source:
          address: "0xfa23fd059662ab424a75691c03b62126afe78057"
          abi: GoldToken
          startBlock: 231300783
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.7
          language: wasm/assemblyscript
          entities:
              - TokenHolder
              - TokenStats
              - Transfer
              - UserActivity
              - DailyStats
          abis:
              - name: GoldToken
                file: ./abis/GoldToken.json
          eventHandlers:
              - event: Transfer(indexed address,indexed address,uint256)
                handler: handleTransfer
          file: ./src/gold-token.ts

    # ===== GoldMinter (Mint/Redeem) =====
    - kind: ethereum
      name: GoldMinter
      network: arbitrum-sepolia
      source:
          address: "0x31bbe260be6cb4878f5df6319d9fe4acc730b469"
          abi: GoldMinter
          startBlock: 231300931
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.7
          language: wasm/assemblyscript
          entities:
              - MintRequest
              - RedeemRequest
              - MintStats
              - UserMintStats
              - UserActivity
              - DailyStats
          abis:
              - name: GoldMinter
                file: ./abis/GoldMinter.json
          eventHandlers:
              - event: RequestMint(indexed uint256,indexed address,address,uint256,uint256)
                handler: handleRequestMint
              - event: SettleMint(indexed uint256,uint256,bool)
                handler: handleSettleMint
              - event: RequestBurn(indexed uint256,indexed address,address,uint256,uint256)
                handler: handleRequestBurn
              - event: SettleBurn(indexed uint256,uint256,bool)
                handler: handleSettleBurn
          file: ./src/gold-minter.ts

    # ===== PancakeSwap V2 Pairs =====

    # AGT / USDT
    - kind: ethereum
      name: PancakeV2Pair_AGT_USDT
      network: arbitrum-sepolia
      source:
          address: "0x436D13E80CfbD0045AE1667201A792b60214793b"
          abi: PancakeV2Pair
          startBlock: 238175177
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.7
          language: wasm/assemblyscript
          entities:
              - Swap
              - SwapStats
              - UserSwapStats
              - UserActivity
              - DailyStats
          abis:
              - name: PancakeV2Pair
                file: ./abis/PancakeV2Pair.json
          eventHandlers:
              - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
                handler: handleSwapV2
          file: ./src/swap-v2.ts

    # AGT / USDC
    - kind: ethereum
