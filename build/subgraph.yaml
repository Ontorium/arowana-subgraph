specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: GoldToken
    network: arbitrum-sepolia
    source:
      address: "0xE02B08b4e21bAf8d364B547F932dB939C76A33BF"
      abi: GoldToken
      startBlock: 236807826
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenHolder
        - TokenStats
        - Transfer
        - UserActivity
        - DailyStats
      abis:
        - name: GoldToken
          file: GoldToken/GoldToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: GoldToken/GoldToken.wasm
