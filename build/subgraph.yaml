specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: GoldToken
    network: arbitrum-sepolia
    source:
      address: "0xfa23fd059662ab424a75691c03b62126afe78057"
      abi: GoldToken
      startBlock: 231300783
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenHolder
        - TokenStats
        - Transfer
        - UserActivity
        - DailyStats
      abis:
        - name: GoldToken
          file: GoldToken/GoldToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: GoldToken/GoldToken.wasm
  - kind: ethereum
    name: GoldMinter
    network: arbitrum-sepolia
    source:
      address: "0x31bbe260be6cb4878f5df6319d9fe4acc730b469"
      abi: GoldMinter
      startBlock: 231300931
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MintRequest
        - RedeemRequest
        - MintStats
        - UserMintStats
        - UserActivity
        - DailyStats
      abis:
        - name: GoldMinter
          file: GoldMinter/GoldMinter.json
      eventHandlers:
        - event: RequestMint(indexed uint256,indexed address,address,uint256,uint256)
          handler: handleRequestMint
        - event: SettleMint(indexed uint256,uint256,bool)
          handler: handleSettleMint
        - event: RequestBurn(indexed uint256,indexed address,address,uint256,uint256)
          handler: handleRequestBurn
        - event: SettleBurn(indexed uint256,uint256,bool)
          handler: handleSettleBurn
      file: GoldMinter/GoldMinter.wasm
  - kind: ethereum
    name: PancakeV2Pair_AGT_USDT
    network: arbitrum-sepolia
    source:
      address: "0x958bD5d338A61868fF800C2Bb98b973a3102b7fE"
      abi: PancakeV2Pair
      startBlock: 231300783
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
        - SwapStats
        - UserSwapStats
        - UserActivity
        - DailyStats
      abis:
        - name: PancakeV2Pair
          file: PancakeV2Pair_AGT_USDT/PancakeV2Pair.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwapV2
      file: PancakeV2Pair_AGT_USDT/PancakeV2Pair_AGT_USDT.wasm
  - kind: ethereum
    name: PancakeV2Pair_AGT_USDC
    network: arbitrum-sepolia
    source:
      address: "0x7522681Bc79c8F60840f409fEc03051cBe04eEA9"
      abi: PancakeV2Pair
      startBlock: 231300783
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
        - SwapStats
        - UserSwapStats
        - UserActivity
        - DailyStats
      abis:
        - name: PancakeV2Pair
          file: PancakeV2Pair_AGT_USDC/PancakeV2Pair.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwapV2
      file: PancakeV2Pair_AGT_USDT/PancakeV2Pair_AGT_USDT.wasm
