type TokenHolder @entity(immutable: false) {
    id: Bytes!
    balance: BigInt!
    transferInCount: Int!
    transferOutCount: Int!
    firstSeenAt: BigInt!
    lastSeenAt: BigInt!
}

type TokenStats @entity(immutable: false) {
    id: ID!
    totalHolders: Int!
    totalTransfers: BigInt!
}

type Transfer @entity(immutable: true) {
    id: Bytes!
    from: Bytes!
    to: Bytes!
    value: BigInt!
    blockNumber: BigInt!
    timestamp: BigInt!
    transactionHash: Bytes!
}

# ===== Swap Tracking =====

type Swap @entity(immutable: true) {
    id: Bytes!
    user: Bytes! # 스왑 실행자
    tokenIn: Bytes! # 입금 토큰 주소
    tokenOut: Bytes! # 출금 토큰 주소
    amountIn: BigInt! # 입금 금액
    amountOut: BigInt! # 출금 금액
    pool: Bytes! # 풀 주소
    blockNumber: BigInt!
    timestamp: BigInt!
    transactionHash: Bytes!
}

type SwapStats @entity(immutable: false) {
    id: ID!
    totalSwapCount: BigInt! # 총 스왑 횟수
    totalVolumeOXAU: BigInt! # OXAU 총 거래량
}

type UserSwapStats @entity(immutable: false) {
    id: Bytes! # 유저 주소
    swapCount: Int! # 스왑 횟수
    totalVolumeIn: BigInt! # OXAU 매수 총량
    totalVolumeOut: BigInt! # OXAU 매도 총량
    firstSwapAt: BigInt!
    lastSwapAt: BigInt!
}

# ===== Mint/Redeem Tracking =====

enum OrderStatus {
    PENDING
    COMPLETED
    FAILED
}

type MintOrder @entity(immutable: false) {
    id: ID! # nonce
    nonce: BigInt!
    buyer: Bytes! # 유저 지갑
    usdToken: Bytes!
    usdAmount: BigInt! # 6 decimals
    minGoldAmount: BigInt! # 18 decimals
    # Settlement (정산 시 연결)
    goldAmount: BigInt # 실제 받은 OXAU
    feeAmount: BigInt # 수수료
    status: OrderStatus!

    # 트랜잭션 정보
    txHash: Bytes!
    blockNumber: BigInt!
    timestamp: BigInt!

    settledTxHash: Bytes
    settledAt: BigInt
}

type BurnOrder @entity(immutable: false) {
    id: ID! # nonce
    nonce: BigInt!
    seller: Bytes! # 유저 지갑
    usdToken: Bytes!
    goldAmount: BigInt! # 18 decimals
    minUsdAmount: BigInt! # 6 decimals
    # Settlement
    usdAmount: BigInt # 실제 받은 USD
    feeAmount: BigInt

    status: OrderStatus!

    txHash: Bytes!
    blockNumber: BigInt!
    timestamp: BigInt!

    settledTxHash: Bytes
    settledAt: BigInt
}

type MintRequest @entity(immutable: false) {
    id: ID! # nonce
    nonce: BigInt!
    buyer: Bytes!
    usdToken: Bytes!
    usdAmount: BigInt!
    minGoldAmount: BigInt!
    goldAmount: BigInt # SettleMint 후 설정
    success: Boolean # SettleMint 후 설정
    status: String! # "pending", "settled"
    requestBlockNumber: BigInt!
    requestTimestamp: BigInt!
    requestTxHash: Bytes!
    settleBlockNumber: BigInt
    settleTimestamp: BigInt
    settleTxHash: Bytes
}

type RedeemRequest @entity(immutable: false) {
    id: ID! # nonce
    nonce: BigInt!
    seller: Bytes!
    usdToken: Bytes!
    goldAmount: BigInt!
    minUsdAmount: BigInt!
    usdAmount: BigInt # SettleBurn 후 설정
    success: Boolean # SettleBurn 후 설정
    status: String! # "pending", "settled"
    requestBlockNumber: BigInt!
    requestTimestamp: BigInt!
    requestTxHash: Bytes!
    settleBlockNumber: BigInt
    settleTimestamp: BigInt
    settleTxHash: Bytes
}

type MintStats @entity(immutable: false) {
    id: ID!
    totalMintCount: BigInt!
    totalMintVolume: BigInt! # 총 민트된 OXAU
    totalRedeemCount: BigInt!
    totalRedeemVolume: BigInt! # 총 리딤된 OXAU
}

type UserMintStats @entity(immutable: false) {
    id: Bytes! # 유저 주소
    mintCount: Int!
    redeemCount: Int!
    totalMintVolume: BigInt! # 총 민트한 OXAU
    totalRedeemVolume: BigInt! # 총 리딤한 OXAU
    firstActivityAt: BigInt!
    lastActivityAt: BigInt!
}

# ===== Unified User Activity =====

type UserActivity @entity(immutable: true) {
    id: Bytes! # txHash + logIndex
    user: Bytes!
    activityType: String! # "mint", "redeem", "swap_buy", "swap_sell", "transfer_in", "transfer_out"
    amount: BigInt! # OXAU 금액
    counterparty: Bytes # transfer의 경우 상대방 주소
    relatedToken: Bytes # swap/mint/redeem의 경우 상대 토큰 (USDT, USDC 등)
    relatedTokenType: String # "USDT", "USDC", "OXAU"
    relatedAmount: BigInt # 상대 토큰 금액
    blockNumber: BigInt!
    timestamp: BigInt!
    transactionHash: Bytes!
}

# ===== Daily Statistics =====

type DailyStats @entity(immutable: false) {
    id: ID! # "2024-01-15" 형식 (YYYY-MM-DD)
    date: BigInt! # Unix timestamp (해당 일 00:00:00 UTC)
    # 홀더 통계
    totalHolders: Int! # 해당 일 기준 총 홀더 수
    newHolders: Int! # 해당 일 신규 홀더 수
    # 전송 통계
    transferCount: Int! # 해당 일 전송 횟수
    transferVolume: BigInt! # 해당 일 전송량 (OXAU)
    # 스왑 통계
    swapCount: Int! # 해당 일 스왑 횟수
    swapVolumeOXAU: BigInt! # 해당 일 스왑 거래량 (OXAU)
    # 민트 통계
    mintCount: Int! # 해당 일 민트 완료 횟수
    mintVolume: BigInt! # 해당 일 민트량 (OXAU)
    # 리딤 통계
    redeemCount: Int! # 해당 일 리딤 완료 횟수
    redeemVolume: BigInt! # 해당 일 리딤량 (OXAU)
}
